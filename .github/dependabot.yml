version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # every github/codeql-action step must be on the same version, so they update together
      codeql:
        patterns: ["github/codeql-action*"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["github/codeql-action*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
